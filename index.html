<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گزارش علی</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <style>
    body{font-family:sans-serif;text-align:center;padding:32px 16px;line-height:1.8}
    .box{max-width:520px;margin:20px auto;padding:18px;border:1px solid #ddd;border-radius:12px}
    .id{font-size:24px;font-weight:700;direction:ltr}
    .note{font-size:13px}
  </style>
</head>
<body>
  <h2>سامانه گزارش‌های علی</h2>
  <p id="status">در حال بررسی اتصال به ایتا...</p>
  <div id="result" class="box" hidden>
    <div>شناسه کاربر فعلی ایتا:</div>
    <div id="uid" class="id"></div>
    <div id="name"></div>
    <p class="note">این صفحه فقط برای تست اتصال است و هیچ توکن API، اطلاعات اکسل یا اطلاعات مالی در آن ذخیره نشده است.</p>
  </div>
  <script>
    (function(){
      const status=document.getElementById('status');
      const result=document.getElementById('result');
      const wa=window.Eitaa&&window.Eitaa.WebApp;
      if(!wa){status.textContent='این صفحه باید از داخل برنامه ایتا باز شود.';return;}
      try{if(typeof wa.ready==='function')wa.ready();if(typeof wa.expand==='function')wa.expand();}catch(e){}
      const user=wa.initDataUnsafe&&wa.initDataUnsafe.user;
      if(!user||user.id==null){status.textContent='اتصال به ایتا برقرار است، اما شناسه کاربر در این اجرا دریافت نشد.';return;}
      status.textContent='اتصال به ایتا برقرار شد.';
      document.getElementById('uid').textContent=String(user.id);
      document.getElementById('name').textContent=[user.first_name||'',user.last_name||''].join(' ').trim();
      result.hidden=false;
    })();
  </script>
</body>
</html>
